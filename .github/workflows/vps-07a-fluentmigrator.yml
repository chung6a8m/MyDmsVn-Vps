name: VPS-07A — immutable FluentMigrator SQL versions (pre-cutover)

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vps-07a-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  versions:
    name: SDK10.0.404 / 13 immutable SQL versions / 28 GO batches
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.404'
      - name: Freeze SQL checksums and version/batch mapping
        run: python3 scripts/verify-vps-07a.py
      - name: Compile FluentMigrator 8.0.1 and exercise executable version contract
        working-directory: src/MyDmsVn.Server.FluentMigrator
        run: |
          set -euo pipefail
          test "$(dotnet --version)" = "10.0.404"
          dotnet restore ../../tests/MyDmsVn.Vps07a.ContractTests/MyDmsVn.Vps07a.ContractTests.csproj --force-evaluate -v minimal
          dotnet build ../../tests/MyDmsVn.Vps07a.ContractTests/MyDmsVn.Vps07a.ContractTests.csproj -c Release -f net10.0 --no-restore -warnaserror -v minimal
          dotnet run --project ../../tests/MyDmsVn.Vps07a.ContractTests/MyDmsVn.Vps07a.ContractTests.csproj -c Release -f net10.0 --no-build --no-restore
      - name: Upload generated NuGet locks for explicit pinning before review
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: vps07a-lockfiles
          path: |
            src/MyDmsVn.Server.FluentMigrator/packages.lock.json
            tests/MyDmsVn.Vps07a.ContractTests/packages.lock.json
          if-no-files-found: warn
