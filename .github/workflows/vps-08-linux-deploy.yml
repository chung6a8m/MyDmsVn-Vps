name: VPS-08 — Linux artifact and protected staging gates

on:
  pull_request:
    types: [opened, reopened, synchronize]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      reviewed_sha:
        description: 'Exact reviewed main HEAD (40 hex); protected staging only'
        required: false
        type: string
      approved_scope:
        description: 'Set reviewed-isolated-sql13-only for protected staging'
        required: false
        type: string

permissions:
  contents: read

# pull_request's github.sha is the synthetic merge SHA, not the reviewed source
# HEAD. Every gate and deployable manifest must use the real source commit.
env:
  VPS08_SOURCE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

concurrency:
  group: vps08-${{ github.ref }}
  cancel-in-progress: false

jobs:
  source-gates:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.VPS08_SOURCE_SHA }}
          persist-credentials: false
      - name: Refuse synthetic merge checkout before any static gate
        run: test "$(git rev-parse HEAD)" = "$VPS08_SOURCE_SHA"
      - name: Validate systemd Nginx credentials and artifact refusal cases
        run: python3 scripts/verify-vps08.py

  linux-publish:
    needs: source-gates
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.VPS08_SOURCE_SHA }}
          persist-credentials: false
      - name: Refuse synthetic merge checkout before building the release
        run: test "$(git rev-parse HEAD)" = "$VPS08_SOURCE_SHA"
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.404'
      - name: Exact SDK and locked Linux net10 restore
        working-directory: src/MyDmsVn.Server.AspNetCoreHost
        run: |
          set -euo pipefail
          test "$(dotnet --version)" = "10.0.404"
          dotnet restore MyDmsVn.Server.AspNetCoreHost.csproj \
            -p:Vps04Server=true -p:Vps06bMediator=true --locked-mode
          dotnet restore ../../tests/MyDmsVn.Server.AspNetCoreHost.Tests/MyDmsVn.Server.AspNetCoreHost.Tests.csproj \
            -p:Vps04Server=true -p:Vps06bMediator=true --locked-mode
      - name: Execute all native proxy cases, exact counts
        working-directory: src/MyDmsVn.Server.AspNetCoreHost
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/vps08-trx"
          dotnet test ../../tests/MyDmsVn.Server.AspNetCoreHost.Tests/MyDmsVn.Server.AspNetCoreHost.Tests.csproj \
            -p:Vps04Server=true -p:Vps06bMediator=true -c Release -f net10.0 --no-restore \
            --filter FullyQualifiedName~Vps08Loopback \
            --logger "trx;LogFileName=vps08-proxy.trx" --results-directory "$GITHUB_WORKSPACE/vps08-trx"
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          from pathlib import Path
          f = Path('../../vps08-trx/vps08-proxy.trx')
          assert f.exists(), 'Missing native proxy TRX'
          ns = '{http://microsoft.com/schemas/VisualStudio/TeamTest/2010}'
          node = ET.parse(f).getroot().find(f'./{ns}ResultSummary/{ns}Counters')
          assert node is not None, 'Missing native TRX counters'
          counts = {x:int(node.attrib[x]) for x in ['total','executed','passed','failed','notExecuted']}
          assert counts == {'total':33,'executed':33,'passed':33,'failed':0,'notExecuted':0}, counts
          print('VPS08_NATIVE_PROXY_PASS: discovered=33 executed=33 passed=33 failed=0 skipped=0')
          PY
      - name: Publish framework-dependent net10 host with locked runtime graph
        working-directory: src/MyDmsVn.Server.AspNetCoreHost
        run: |
          set -euo pipefail
          dotnet publish MyDmsVn.Server.AspNetCoreHost.csproj \
            -p:Vps04Server=true -p:Vps06bMediator=true -p:UseAppHost=false \
            -c Release -f net10.0 --no-restore -warnaserror -o "$GITHUB_WORKSPACE/vps08-publish"
          test -f "$GITHUB_WORKSPACE/vps08-publish/MyDmsVn.Server.AspNetCoreHost.dll"
          python3 - <<'PY'
          from pathlib import Path
          deps=Path('../../vps08-publish/MyDmsVn.Server.AspNetCoreHost.deps.json').read_text()
          assert 'Newtonsoft.Json/' not in deps
          assert 'MediatR/' not in deps
          print('VPS08_RUNTIME_DEPENDENCIES_PASS: Newtonsoft=0, MediatR=0')
          PY
      - name: Create and verify exact-source manifest
        run: |
          set -euo pipefail
          python3 scripts/vps08-manifest.py create vps08-publish "$VPS08_SOURCE_SHA"
          python3 scripts/vps08-manifest.py verify vps08-publish "$VPS08_SOURCE_SHA"
      - name: Preserve source-pinned release candidate, never credentials
        uses: actions/upload-artifact@v6
        with:
          name: vps08-linux-net10-${{ env.VPS08_SOURCE_SHA }}
          path: vps08-publish/
          if-no-files-found: error
          retention-days: 7
      - name: Preserve native proxy test counters
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: vps08-proxy-test-evidence
          path: vps08-trx/*.trx
          if-no-files-found: warn

  protected-staging:
    # Intentionally SKIPPED for PRs/push. OWN-VPS-04 requires exact-main
    # admission, disabled admin bypass and a dedicated NONPRODUCTION runner.
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/main' &&
      inputs.approved_scope == 'reviewed-isolated-sql13-only' &&
      inputs.reviewed_sha == github.sha
    needs: linux-publish
    runs-on: [self-hosted, linux, vps08-staging]
    environment: vps08-sql13-nonproduction
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@v6
        with:
          name: vps08-linux-net10-${{ github.sha }}
          path: vps08-publish
      - name: Require exact SHA, restricted isolated host and owner attestation
        env:
          STAGING_PROBE: ${{ vars.VPS08_STAGING_PROBE_URL }}
          STAGING_MACHINE_SHA256: ${{ vars.VPS08_STAGING_MACHINE_SHA256 }}
          STAGING_HOST_ATTESTATION: ${{ secrets.VPS08_STAGING_HOST_ATTESTATION }}
          RECEIPT_STATE_PATH: ${{ vars.VPS08_RECEIPT_STATE_PATH }}
          VPS08_OWNER: ${{ vars.VPS08_OWNER }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$RUNNER_OS" = Linux
          test -n "$STAGING_PROBE" && test -n "$STAGING_HOST_ATTESTATION"
          test -n "$RECEIPT_STATE_PATH" && test "$VPS08_OWNER" = chung6a8m
          test "$STAGING_HOST_ATTESTATION" = reviewed-isolated-sql13-only
          # Pin to the Owner-reviewed machine; runner labels alone
          # are not sufficient proof that the host is approved staging.
          [[ "$STAGING_MACHINE_SHA256" =~ ^[0-9a-f]{64}$ ]]
          test -r /etc/machine-id
          test "$(sha256sum /etc/machine-id | cut -d ' ' -f1)" = "$STAGING_MACHINE_SHA256"
          python3 scripts/vps08-manifest.py verify vps08-publish "$GITHUB_SHA"
          test "$(id -un)" = vps08runner
          test -f /etc/mydmsvn/runtime.env
          test -f /etc/systemd/system/mydmsvn-vps.service
          artifact_sha="$(sha256sum vps08-publish/vps08-manifest.json | cut -d ' ' -f1)"
          python3 scripts/vps09_linux_receipt.py init \
            --state "$RECEIPT_STATE_PATH" --source-sha "$GITHUB_SHA" \
            --machine-sha256 "$STAGING_MACHINE_SHA256" --artifact-sha256 "$artifact_sha" \
            --owner "$VPS08_OWNER"
          echo "VPS08_RECEIPT_INITIALIZED: eight physical evidence events remain required"
      - name: Deploy exact reviewed SHA and prove verified TLS health
        env:
          STAGING_PROBE: ${{ vars.VPS08_STAGING_PROBE_URL }}
        run: |
          set -euo pipefail
          sudo /usr/local/libexec/vps08-rollout deploy "$GITHUB_WORKSPACE/vps08-publish" \
            "$GITHUB_SHA" "$STAGING_PROBE"
          sudo systemctl restart mydmsvn-vps.service
          curl --fail --silent --show-error --max-time 8 --proto '=https' --tlsv1.2 \
            "$STAGING_PROBE" >/dev/null
          echo "VPS08_STAGING_DEPLOY_SMOKE_PASS: actual_systemd_https=true"
      - name: Prove unauthenticated local HTTP cannot bypass Nginx
        env:
          STAGING_PROBE: ${{ vars.VPS08_STAGING_PROBE_URL }}
        run: |
          set -euo pipefail
          # Direct localhost has no privileged proxy token: it MUST be 400.
          url=http://127.0.0.1:5080/api/v1/health
          code="$(curl --silent --output /dev/null --write-out '%{http_code}' \
            --max-time 5 --noproxy '*' --proto '=http' "$url")"
          test "$code" = 400
          host="${STAGING_PROBE#https://}"
          host="${host%%/*}"
          code="$(curl --silent --output /dev/null --write-out '%{http_code}' \
            --max-time 5 --noproxy '*' --proto '=http' \
            -H "Host: $host" -H 'X-Forwarded-For: 198.51.100.17' \
            -H 'X-Forwarded-Proto: https' "$url")"
          test "$code" = 400
          echo "VPS08_STAGING_LOOPBACK_BYPASS_DENIED: 2/2"
      - name: Prove restart after killed main process
        env:
          STAGING_PROBE: ${{ vars.VPS08_STAGING_PROBE_URL }}
        run: |
          set -euo pipefail
          sudo systemctl kill --kill-whom=main --signal=SIGKILL mydmsvn-vps.service
          recovered=0
          for i in $(seq 1 30); do
            if sudo systemctl is-active --quiet mydmsvn-vps.service &&
               curl --fail --silent --max-time 3 --proto '=https' --tlsv1.2 \
                 "$STAGING_PROBE" >/dev/null 2>&1; then recovered=1; break; fi
            sleep 2
          done
          test "$recovered" = 1
          echo "VPS08_STAGING_SIGKILL_RECOVERY_PASS"
