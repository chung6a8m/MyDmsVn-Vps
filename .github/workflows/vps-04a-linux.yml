name: VPS-04A — ASP.NET Core 10 Linux build and frozen route gate

on:
  pull_request:
    types: [opened, reopened, synchronize, labeled]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: vps-04a-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:

  local-simulation-linux-safety:
    name: Linux local simulation shell safety (12 tests, no skips)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - name: Execute the complete Linux shell safety suite
        run: |
          python3 - <<'PY'
          import unittest
          expected = 12
          suite = unittest.defaultTestLoader.loadTestsFromName('scripts.tests.test_local_simulation_wsl')
          assert suite.countTestCases() == expected, (suite.countTestCases(), expected)
          result = unittest.TextTestRunner(verbosity=2).run(suite)
          assert result.testsRun == expected, (result.testsRun, expected)
          assert not result.failures and not result.errors and not result.skipped, result
          PY

  local-simulation-windows-safety:
    name: Windows local simulation operator safety (30 tests, no skips)
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Execute the complete Windows operator safety suite
        shell: pwsh
        env:
          MYDMSVN_TEST_DOCKER_ENGINE_ID: 11111111-2222-4333-8444-555555555555
        run: |
          @'
          import unittest
          expected = 30
          suite = unittest.defaultTestLoader.loadTestsFromName('scripts.tests.test_local_simulation')
          assert suite.countTestCases() == expected, (suite.countTestCases(), expected)
          result = unittest.TextTestRunner(verbosity=2).run(suite)
          assert result.testsRun == expected, (result.testsRun, expected)
          assert not result.failures and not result.errors and not result.skipped, result
          '@ | python -

  # Manual pre-merge acceptance trigger: only on the explicit labeled event,
  # same-repo PR head and protected nonproduction environment reviewer approval.
  # Never run mutation tests automatically on pushes or ordinary PR synchronization.
  approved-linux-sql:
    if: >-
      github.event_name == 'pull_request' &&
      github.event.action == 'labeled' &&
      github.ref == 'refs/pull/9/merge' &&
      github.event.pull_request.number == 9 &&
      github.event.pull_request.base.ref == 'main' &&
      github.event.label.name == 'vps04a-live-approved' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'codex/vps-04a-net10-aspnetcore'
    uses: ./.github/workflows/vps-04a-live-acceptance.yml
    secrets: inherit
  linux-net10:
    name: Ubuntu SDK 10.0.404 restore/build and 57-route inventory (SQL-free)
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.404'
      - name: Pin nested server SDK
        working-directory: src/MyDmsVn.Server.AspNetCoreHost
        run: test "$(dotnet --version)" = "10.0.404"
      - name: Validate GitHub Environment operator admission helper (no GitHub login)
        run: |
          python3 -m py_compile scripts/configure-vps04a-live-gate.py
          python3 scripts/configure-vps04a-live-gate.py --help >/dev/null
      - name: Regression-test protected live gate ref/SHA policy without credentials
        run: python3 -m unittest discover -s scripts/tests -p 'test_vps04a_live_gate.py' -v
      - name: Restore and compile ASP.NET Core host / Server net10 graph
        working-directory: src/MyDmsVn.Server.AspNetCoreHost
        run: |
          dotnet restore MyDmsVn.Server.AspNetCoreHost.csproj -p:Vps04Server=true -p:Vps06bMediator=true --locked-mode -v minimal
          dotnet build MyDmsVn.Server.AspNetCoreHost.csproj -p:Vps04Server=true -p:Vps06bMediator=true -c Release -f net10.0 --no-restore -warnaserror -v minimal
      - name: VPS-04B enforce Linux runtime dependency boundary
        run: python3 scripts/verify-vps04b-runtime-boundary.py
      - name: Restore and execute net10 Server.Application xUnit v3 regressions
        working-directory: src/MyDmsVn.Server.AspNetCoreHost
        run: |
          dotnet restore ../../tests/MyDmsVn.Server.Application.Tests/MyDmsVn.Server.Application.Tests.csproj -p:Vps04Server=true --locked-mode -v minimal
          dotnet test ../../tests/MyDmsVn.Server.Application.Tests/MyDmsVn.Server.Application.Tests.csproj -p:Vps04Server=true -c Release -f net10.0 --no-restore -v minimal --logger "trx;LogFileName=vps04a-server-application.trx" --results-directory "$GITHUB_WORKSPACE/vps04a-trx"
      - name: Verify actual net10 xUnit execution count
        run: |
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          from pathlib import Path
          files=list(Path('vps04a-trx').glob('*.trx'))
          assert len(files)==1, f'Expected exactly one TRX, found {len(files)}'
          doc=ET.parse(files[0]).getroot()
          ns={'t': 'http://microsoft.com/schemas/VisualStudio/TeamTest/2010'}
          counters=doc.find('./t:ResultSummary/t:Counters',ns)
          assert counters is not None, 'Missing TRX counters'
          counts={k:int(v) for k,v in counters.attrib.items() if k in ('total','passed','failed','executed','notExecuted')}
          assert counts['total']>=363 and counts['executed']>=363, counts
          assert counts['failed']==0 and counts['notExecuted']==0 and counts['passed']==counts['total'], counts
          print(f"PASS net10 Server.Application: {counts}")
          PY
      - name: Run native ASP.NET Core boundary regressions without SQL
        working-directory: src/MyDmsVn.Server.AspNetCoreHost
        run: |
          dotnet restore ../../tests/MyDmsVn.Server.AspNetCoreHost.Tests/MyDmsVn.Server.AspNetCoreHost.Tests.csproj -p:Vps04Server=true -p:Vps06bMediator=true --locked-mode -v minimal
          dotnet test ../../tests/MyDmsVn.Server.AspNetCoreHost.Tests/MyDmsVn.Server.AspNetCoreHost.Tests.csproj -p:Vps04Server=true -p:Vps06bMediator=true -c Release -f net10.0 --no-restore -v minimal --logger "trx;LogFileName=vps04a-core-boundary.trx" --results-directory "$GITHUB_WORKSPACE/vps04a-trx"
      - name: Run local simulation admission tests
        working-directory: src/MyDmsVn.Server.AspNetCoreHost
        run: |
          dotnet restore ../../tests/MyDmsVn.LocalSimulation.Tests/MyDmsVn.LocalSimulation.Tests.csproj -p:Vps04Server=true -p:Vps06bMediator=true --locked-mode -v minimal
          dotnet test ../../tests/MyDmsVn.LocalSimulation.Tests/MyDmsVn.LocalSimulation.Tests.csproj -p:Vps04Server=true -p:Vps06bMediator=true -c Release -f net10.0 --no-restore -v minimal \
            --logger "trx;LogFileName=local-simulation-admission.trx" --results-directory "$GITHUB_WORKSPACE/vps04a-trx"
          python3 - <<'PY'
          import os
          import xml.etree.ElementTree as ET
          from pathlib import Path
          path=Path(os.environ['GITHUB_WORKSPACE'])/'vps04a-trx'/'local-simulation-admission.trx'
          ns={'t': 'http://microsoft.com/schemas/VisualStudio/TeamTest/2010'}
          counters=ET.parse(path).getroot().find('./t:ResultSummary/t:Counters',ns)
          assert counters is not None, 'Missing local simulation TRX counters'
          counts={k:int(v) for k,v in counters.attrib.items() if k in ('total','passed','failed','executed','notExecuted')}
          assert counts['total']>=15 and counts['executed']>=15, counts
          assert counts['failed']==0 and counts['notExecuted']==0 and counts['passed']==counts['total'], counts
          print(f"PASS local simulation admission: {counts}")
          PY
      - name: Require native boundary test execution, no failure or skip
        run: |
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          from pathlib import Path
          files=list(Path('vps04a-trx').glob('vps04a-core-boundary.trx'))
          assert len(files)==1, f'Expected one boundary TRX, found {len(files)}'
          doc=ET.parse(files[0]).getroot()
          ns={'t': 'http://microsoft.com/schemas/VisualStudio/TeamTest/2010'}
          counters=doc.find('./t:ResultSummary/t:Counters',ns)
          assert counters is not None, 'Missing native boundary TRX counters'
          counts={k:int(v) for k,v in counters.attrib.items() if k in ('total','passed','failed','executed','notExecuted')}
          # 25 original boundary + 178 source-file pins + 2 corpus/fingerprint facts.
          assert counts['total']>=205 and counts['executed']>=205, counts
          assert counts['failed']==0 and counts['notExecuted']==0 and counts['passed']==counts['total'], counts
          print(f"PASS net10 HTTP boundary: {counts}")
          PY
      - name: Require VPS-10.0 characterization and frozen source pins (37 cases)
        working-directory: src/MyDmsVn.Server.AspNetCoreHost
        run: |
          dotnet test ../../tests/MyDmsVn.Server.AspNetCoreHost.Tests/MyDmsVn.Server.AspNetCoreHost.Tests.csproj \
            -p:Vps04Server=true -p:Vps06bMediator=true -c Release -f net10.0 --no-build --no-restore -v minimal \
            --filter FullyQualifiedName~Vps10ContractCharacterizationTests \
            --logger "trx;LogFileName=vps10-characterization.trx" --results-directory "$GITHUB_WORKSPACE/vps04a-trx"
          git -C "$GITHUB_WORKSPACE" fetch --no-tags --depth=1 origin 58111f95f8dbb708fbd7c9ce8480b3f952dbaad3
          python3 - <<'PY'
          import copy, json, os, re, subprocess
          import xml.etree.ElementTree as ET
          from pathlib import Path
          root = Path(os.environ['GITHUB_WORKSPACE'])
          baseline = '58111f95f8dbb708fbd7c9ce8480b3f952dbaad3'
          required_pins = {
              'docs/contracts/vps-01-route-inventory.json',
              'docs/contracts/vps-02-route-additions.json',
              'docs/contracts/vps-05c-desktop-route-net48.json',
              'docs/contracts/vps-02-desktop-method-matrix.json',
              'docs/contracts/web4-v1/fingerprint-vectors.json',
              'docs/evidence/vps-04a-live-route-parity.md',
          }
          def git(*args):
              return subprocess.check_output(['git', *args], cwd=root, text=True)
          def frozen(path):
              return git('show', baseline + ':' + path)
          def representative_cases(source):
              # Read only the three original representative TheoryData tables.
              source = source.split('public async Task LegacyControlRouteMatchesLiveNet48', 1)[0]
              rows = re.findall(r'\{\s*"(VPS0[12]-[^"]+)",\s*"([A-Z]+)",\s*"([^"]+)"', source)
              cases = {case: (verb, path.split('?', 1)[0]) for case, verb, path in rows}
              assert len(rows) == len(cases) == 57, 'Representative oracle IDs must remain unique'
              return cases
          case_source = 'tests/MyDmsVn.Server.AspNetCoreHost.Tests/Vps05cDesktopRouteLiveParityTests.cs'
          cases = representative_cases(frozen(case_source))
          assert representative_cases((root/case_source).read_text(encoding='utf-8-sig')) == cases
          ledger_rows = re.findall(r'^\| (?:WEB[2-6]|VPS-02) \| \x60([^\x60]+)\x60 \| \x60[^\x60]+\x60 \| \x60([^\x60]+)\x60 \|',
                                   frozen('docs/evidence/vps-04a-live-route-parity.md'), re.M)
          ledger = dict(ledger_rows)
          assert len(ledger_rows) == len(ledger) == 57
          vector_path = 'web4-v1/fingerprint-vectors.json'
          vectors = json.loads(frozen('docs/contracts/' + vector_path).lstrip('\ufeff'))['vectors']
          canonical_scopes = {v['intent']['method'] + ' ' + v['intent']['routeScope'] for v in vectors}
          assert len(canonical_scopes) == 6
          parameters = {
              '{id:int}': r'[0-9]+',
              '{saleId}': r'[0-9]+',
              '{receiptId}': r'[0-9]+',
              '{operationId}': r'[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}',
          }
          def verify(manifest):
              assert manifest['baselineCommit'] == baseline
              assert set(manifest['sourcePins']) == required_pins, 'Required frozen pins missing or changed'
              for path, expected in manifest['sourcePins'].items():
                  pinned = git('rev-parse', baseline + ':' + path).strip()
                  actual = git('rev-parse', 'HEAD:' + path).strip()
                  assert pinned == expected == actual, (path, pinned, expected, actual)
              rows = manifest['routes']
              assert len(rows) == len({row['id'] for row in rows}) == 57
              assert {row['id'] for row in rows} == set(ledger)
              assert {row['coverage']['rawHttpCaseId'] for row in rows} == set(cases)
              for row in rows:
                  coverage = row['coverage']
                  verb, sample = cases[coverage['rawHttpCaseId']]
                  assert row['id'] == row['httpMethod'] + ' ' + row['path']
                  assert (verb, sample) == (row['httpMethod'], coverage['rawHttpSamplePath']), row['id']
                  template = '/'.join(parameters.get(part, re.escape(part)) for part in row['path'].split('/'))
                  assert re.fullmatch(template, sample), (row['id'], sample)
                  assert coverage['historicalSqlLedger'] == ledger[row['id']], row['id']
                  expected_vectors = vector_path if row['id'] in canonical_scopes else None
                  assert coverage['canonicalBytes'] == expected_vectors, row['id']
          manifest = json.loads((root/'docs/contracts/vps-10-route-migration.json').read_text(encoding='utf-8-sig'))
          verify(manifest)
          # Negative controls: mutations preserving route/variant counts must fail.
          def require_rejected(mutated, label):
              try:
                  verify(mutated)
              except AssertionError:
                  return
              raise AssertionError('Manifest accepted invalid ' + label)
          swapped = copy.deepcopy(manifest)
          a, b = (next(row for row in swapped['routes'] if row['id'] == key)
                  for key in ('GET /api/v1/catalog/products/lookup', 'GET /api/v1/catalog/customers/lookup'))
          for key in ('rawHttpCaseId', 'rawHttpSamplePath'):
              a['coverage'][key], b['coverage'][key] = b['coverage'][key], a['coverage'][key]
          a['requiredPositiveNegativeCases'], b['requiredPositiveNegativeCases'] = b['requiredPositiveNegativeCases'], a['requiredPositiveNegativeCases']
          require_rejected(swapped, 'route/case swap')
          missing_pin = copy.deepcopy(manifest)
          missing_pin['sourcePins'].pop('docs/contracts/vps-05c-desktop-route-net48.json')
          require_rejected(missing_pin, 'missing source pin')
          wrong_sql = copy.deepcopy(manifest)
          wrong_sql['routes'][0]['coverage']['historicalSqlLedger'] = 'ROUTE_ONLY'
          require_rejected(wrong_sql, 'SQL ledger reassignment')
          wrong_canonical = copy.deepcopy(manifest)
          next(row for row in wrong_canonical['routes'] if row['coverage']['canonicalBytes'] is not None)['coverage']['canonicalBytes'] = None
          require_rejected(wrong_canonical, 'missing canonical scope')
          print('PASS VPS-10 route/case links 57/57, SQL ledger 57/57, canonical scopes 6/6, frozen pins 6/6, negative controls 4/4')
          ns = {'t': 'http://microsoft.com/schemas/VisualStudio/TeamTest/2010'}
          counters = ET.parse(root/'vps04a-trx/vps10-characterization.trx').getroot().find('./t:ResultSummary/t:Counters', ns)
          assert counters is not None, 'Missing VPS-10 characterization TRX counters'
          counts = {k: int(v) for k, v in counters.attrib.items() if k in ('total','executed','passed','failed','notExecuted')}
          assert counts == {'total':37,'executed':37,'passed':37,'failed':0,'notExecuted':0}, counts
          print(f'PASS VPS-10.0 characterization and frozen source pins: {counts}')
          PY
      - name: Require VPS-10.1 host composition (26 cases)
        working-directory: src/MyDmsVn.Server.AspNetCoreHost
        run: |
          dotnet test ../../tests/MyDmsVn.Server.AspNetCoreHost.Tests/MyDmsVn.Server.AspNetCoreHost.Tests.csproj \
            -p:Vps04Server=true -p:Vps06bMediator=true -c Release -f net10.0 --no-build --no-restore -v minimal \
            --filter FullyQualifiedName~Vps10HostCompositionTests \
            --logger "trx;LogFileName=vps10-composition.trx" --results-directory "$GITHUB_WORKSPACE/vps04a-trx"
          python3 - <<'PY'
          import os
          import xml.etree.ElementTree as ET
          from pathlib import Path
          ns = {'t': 'http://microsoft.com/schemas/VisualStudio/TeamTest/2010'}
          path = Path(os.environ['GITHUB_WORKSPACE'])/'vps04a-trx/vps10-composition.trx'
          counters = ET.parse(path).getroot().find('./t:ResultSummary/t:Counters', ns)
          assert counters is not None, 'Missing VPS-10.1 composition TRX counters'
          counts = {k: int(v) for k, v in counters.attrib.items() if k in ('total','executed','passed','failed','notExecuted')}
          assert counts == {'total':26,'executed':26,'passed':26,'failed':0,'notExecuted':0}, counts
          print(f'PASS VPS-10.1 composition: {counts}')
          PY
      - name: Require VPS-10.2 native lookup, actual route ownership, OpenAPI and feature gate (34 cases)
        working-directory: src/MyDmsVn.Server.AspNetCoreHost
        run: |
          dotnet test ../../tests/MyDmsVn.Server.AspNetCoreHost.Tests/MyDmsVn.Server.AspNetCoreHost.Tests.csproj \
            -p:Vps04Server=true -p:Vps06bMediator=true -c Release -f net10.0 --no-build --no-restore -v minimal \
            --filter 'FullyQualifiedName~Vps10NativeCatalogTests|FullyQualifiedName~Vps10EndpointInventoryTests|FullyQualifiedName~Vps10OpenApiAndFeatureGateTests' \
            --logger "trx;LogFileName=vps10-native-lookup.trx" --results-directory "$GITHUB_WORKSPACE/vps04a-trx"
          python3 - <<'PY'
          import os
          import xml.etree.ElementTree as ET
          from pathlib import Path
          ns = {'t': 'http://microsoft.com/schemas/VisualStudio/TeamTest/2010'}
          path = Path(os.environ['GITHUB_WORKSPACE'])/'vps04a-trx/vps10-native-lookup.trx'
          counters = ET.parse(path).getroot().find('./t:ResultSummary/t:Counters', ns)
          assert counters is not None, 'Missing VPS-10.2 TRX counters'
          counts = {k: int(v) for k, v in counters.attrib.items() if k in ('total','executed','passed','failed','notExecuted')}
          assert counts == {'total':34,'executed':34,'passed':34,'failed':0,'notExecuted':0}, counts
          print(f'PASS VPS-10.2 native lookup: {counts}')
          PY
      - name: Require VPS-10.4A native Sales reads (44 cases)
        working-directory: src/MyDmsVn.Server.AspNetCoreHost
        run: |
          dotnet test ../../tests/MyDmsVn.Server.AspNetCoreHost.Tests/MyDmsVn.Server.AspNetCoreHost.Tests.csproj \
            -p:Vps04Server=true -p:Vps06bMediator=true -c Release -f net10.0 --no-build --no-restore -v minimal \
            --filter FullyQualifiedName~Vps10SalesReadTests \
            --logger "trx;LogFileName=vps10-sales-reads.trx" --results-directory "$GITHUB_WORKSPACE/vps04a-trx"
          python3 - <<'PY'
          import os
          import xml.etree.ElementTree as ET
          from pathlib import Path
          ns = {'t': 'http://microsoft.com/schemas/VisualStudio/TeamTest/2010'}
          path = Path(os.environ['GITHUB_WORKSPACE'])/'vps04a-trx/vps10-sales-reads.trx'
          counters = ET.parse(path).getroot().find('./t:ResultSummary/t:Counters', ns)
          assert counters is not None, 'Missing VPS-10.4A TRX counters'
          counts = {k: int(v) for k, v in counters.attrib.items() if k in ('total','executed','passed','failed','notExecuted')}
          assert counts == {'total':44,'executed':44,'passed':44,'failed':0,'notExecuted':0}, counts
          print(f'PASS VPS-10.4A Sales reads: {counts}')
          PY
      - name: Require all 293 live 57-route differential cases
        working-directory: src/MyDmsVn.Server.AspNetCoreHost
        run: |
          dotnet test ../../tests/MyDmsVn.Server.AspNetCoreHost.Tests/MyDmsVn.Server.AspNetCoreHost.Tests.csproj \
            -p:Vps04Server=true -p:Vps06bMediator=true -c Release -f net10.0 --no-build --no-restore -v minimal \
            --filter FullyQualifiedName~Vps05cDesktopRouteLiveParityTests \
            --logger "trx;LogFileName=vps05c-live-desktop-routes.trx" --results-directory "$GITHUB_WORKSPACE/vps04a-trx"
          python3 - <<'PY'
          import os
          import xml.etree.ElementTree as ET
          from pathlib import Path
          path=Path(os.environ['GITHUB_WORKSPACE'])/'vps04a-trx'/'vps05c-live-desktop-routes.trx'
          assert path.is_file(), 'Missing VPS-05C live route TRX'
          ns={'t': 'http://microsoft.com/schemas/VisualStudio/TeamTest/2010'}
          counters=ET.parse(path).getroot().find('./t:ResultSummary/t:Counters',ns)
          assert counters is not None, 'Missing VPS-05C live route counters'
          counts={k:int(v) for k,v in counters.attrib.items() if k in ('total','passed','failed','executed','notExecuted')}
          assert counts == {'total':293,'executed':293,'passed':293,'failed':0,'notExecuted':0}, counts
          print(f"PASS net10 live 57-route differential: {counts}")
          PY
      - name: Reflect compiled ASP.NET Core endpoint inventory
        working-directory: src/MyDmsVn.Server.AspNetCoreHost
        run: |
          dotnet run --project MyDmsVn.Server.AspNetCoreHost.csproj -p:Vps04Server=true -p:Vps06bMediator=true --no-build -c Release -- --list-routes > "$GITHUB_WORKSPACE/vps04a-routes.json"
      - name: Compare native endpoint mapping with immutable WEB2-6 and Desktop API routes
        run: python3 scripts/verify-vps-04a.py vps04a-routes.json
      - name: Validate WEB2-WEB6 57-route live coverage ledger against frozen route source
        run: python3 scripts/verify-vps-04a-live-route-parity.py
      - name: Compile optional real HTTPS to SQL tests without running or skipping them
        working-directory: src/MyDmsVn.Server.AspNetCoreHost
        run: |
          dotnet build ../../tests/MyDmsVn.Server.AspNetCoreHost.Tests/MyDmsVn.Server.AspNetCoreHost.Tests.csproj -p:Vps04Server=true -p:Vps06bMediator=true -p:Vps04ALive=true -c Release -f net10.0 --no-restore -warnaserror -v minimal
      - name: Preserve route evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: vps04a-net10-route-inventory
          path: |
            vps04a-routes.json
            vps04a-trx/*.trx
          if-no-files-found: warn
