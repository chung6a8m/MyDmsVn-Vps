name: VPS-04A — ASP.NET Core 10 Linux build and frozen route gate

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vps-04a-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux-net10:
    name: Ubuntu SDK 10.0.404 restore/build and 57-route inventory (SQL-free)
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.404'
      - name: Pin nested server SDK
        working-directory: src/MyDmsVn.Server.AspNetCoreHost
        run: test "$(dotnet --version)" = "10.0.404"
      - name: Restore and compile ASP.NET Core host / Server net10 graph
        working-directory: src/MyDmsVn.Server.AspNetCoreHost
        run: |
          dotnet restore MyDmsVn.Server.AspNetCoreHost.csproj -p:Vps04Server=true -v minimal
          dotnet build MyDmsVn.Server.AspNetCoreHost.csproj -p:Vps04Server=true -c Release -f net10.0 --no-restore -warnaserror -v minimal
      - name: Restore and execute net10 Server.Application xUnit v3 regressions
        working-directory: src/MyDmsVn.Server.AspNetCoreHost
        run: |
          dotnet restore ../../tests/MyDmsVn.Server.Application.Tests/MyDmsVn.Server.Application.Tests.csproj -p:Vps04Server=true -v minimal
          dotnet test ../../tests/MyDmsVn.Server.Application.Tests/MyDmsVn.Server.Application.Tests.csproj -p:Vps04Server=true -c Release -f net10.0 --no-restore -v minimal --logger "trx;LogFileName=vps04a-server-application.trx" --results-directory "$GITHUB_WORKSPACE/vps04a-trx"
      - name: Verify actual net10 xUnit execution count
        run: |
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          from pathlib import Path
          files=list(Path('vps04a-trx').glob('*.trx'))
          assert len(files)==1, f'Expected exactly one TRX, found {len(files)}'
          doc=ET.parse(files[0]).getroot()
          ns={'t': 'http://microsoft.com/schemas/VisualStudio/TeamTest/2010'}
          counters=doc.find('./t:ResultSummary/t:Counters',ns)
          assert counters is not None, 'Missing TRX counters'
          counts={k:int(v) for k,v in counters.attrib.items() if k in ('total','passed','failed','executed','notExecuted')}
          assert counts['total']>=363 and counts['executed']>=363, counts
          assert counts['failed']==0 and counts['notExecuted']==0 and counts['passed']==counts['total'], counts
          print(f"PASS net10 Server.Application: {counts}")
          PY
      - name: Run native ASP.NET Core boundary regressions without SQL
        working-directory: src/MyDmsVn.Server.AspNetCoreHost
        run: |
          dotnet restore ../../tests/MyDmsVn.Server.AspNetCoreHost.Tests/MyDmsVn.Server.AspNetCoreHost.Tests.csproj -p:Vps04Server=true -v minimal
          dotnet test ../../tests/MyDmsVn.Server.AspNetCoreHost.Tests/MyDmsVn.Server.AspNetCoreHost.Tests.csproj -p:Vps04Server=true -c Release -f net10.0 --no-restore -v minimal --logger "trx;LogFileName=vps04a-core-boundary.trx" --results-directory "$GITHUB_WORKSPACE/vps04a-trx"
      - name: Require native boundary test execution, no failure or skip
        run: |
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          from pathlib import Path
          files=list(Path('vps04a-trx').glob('vps04a-core-boundary.trx'))
          assert len(files)==1, f'Expected one boundary TRX, found {len(files)}'
          doc=ET.parse(files[0]).getroot()
          ns={'t': 'http://microsoft.com/schemas/VisualStudio/TeamTest/2010'}
          counters=doc.find('./t:ResultSummary/t:Counters',ns)
          assert counters is not None, 'Missing native boundary TRX counters'
          counts={k:int(v) for k,v in counters.attrib.items() if k in ('total','passed','failed','executed','notExecuted')}
          assert counts['total']>=15 and counts['executed']>=15, counts
          assert counts['failed']==0 and counts['notExecuted']==0 and counts['passed']==counts['total'], counts
          print(f"PASS net10 HTTP boundary: {counts}")
          PY
      - name: Reflect compiled ASP.NET Core endpoint inventory
        working-directory: src/MyDmsVn.Server.AspNetCoreHost
        run: |
          dotnet run --project MyDmsVn.Server.AspNetCoreHost.csproj -p:Vps04Server=true --no-build -c Release -- --list-routes > "$GITHUB_WORKSPACE/vps04a-routes.json"
      - name: Compare native endpoint mapping with immutable WEB2-6 and Desktop API routes
        run: python3 scripts/verify-vps-04a.py vps04a-routes.json
      - name: Capture deterministic net10 package lock snapshots for review
        run: |
          python3 - <<'PY'
          import base64
          from pathlib import Path
          paths=[
              Path('src/MyDmsVn.Contracts/obj/vps04a.packages.lock.json'),
              Path('src/MyDmsVn.SharedKernel/obj/vps04a.packages.lock.json'),
              Path('src/MyDmsVn.Server.Domain/obj/vps04a.packages.lock.json'),
              Path('src/MyDmsVn.Server.Application/obj/vps04a.packages.lock.json'),
              Path('src/MyDmsVn.Server.Infrastructure/obj/vps04a.packages.lock.json'),
              Path('src/MyDmsVn.Server.AspNetCoreHost/obj/vps04a.packages.lock.json'),
              Path('tests/MyDmsVn.Server.Application.Tests/obj/vps04a.packages.lock.json'),
              Path('tests/MyDmsVn.Server.AspNetCoreHost.Tests/obj/vps04a.packages.lock.json'),
          ]
          for path in paths:
              if not path.is_file():
                  raise RuntimeError(f'Missing generated net10 lock: {path}')
              print(f'VPS04A_LOCK_BEGIN {path.as_posix()}',flush=True)
              data=base64.b64encode(path.read_bytes()).decode('ascii')
              for i in range(0,len(data),3000):
                  print(data[i:i+3000],flush=True)
              print(f'VPS04A_LOCK_END {path.as_posix()}',flush=True)
          PY
      - name: Preserve route evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: vps04a-net10-route-inventory
          path: |
            vps04a-routes.json
            vps04a-trx/*.trx
          if-no-files-found: warn
