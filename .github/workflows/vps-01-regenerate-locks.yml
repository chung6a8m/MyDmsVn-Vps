# TEMPORARY: delete after xUnit v3 locks are committed and the final CI is green.
name: VPS-01 temporary xUnit v3 locked restore regeneration
on:
  push:
    branches: [codex/vps-01-test-contract-foundation]
permissions:
  contents: write
concurrency:
  group: vps-01-restore-${{ github.ref }}
  cancel-in-progress: false
jobs:
  regenerate:
    if: github.repository == 'chung6a8m/MyDmsVn-Vps'
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: true
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '8.0.400'
      - name: Apply deterministic source compatibility changes
        run: python scripts/vps-01-upgrade-xunit.py
      - name: Recalculate NuGet lock files (no locked-mode bypass in regular CI)
        shell: pwsh
        run: |
          $projects = Get-ChildItem tests -Directory | ForEach-Object {
            Join-Path $_.FullName ($_.Name + '.csproj')
          } | Where-Object { Test-Path $_ }
          $projects = @($projects | Where-Object { $_ -notmatch 'CrashHost' } | Sort-Object)
          if ($projects.Count -ne 12) { throw "Expected twelve xUnit test projects, got $($projects.Count)" }
          foreach ($project in $projects) {
            Write-Host "Refreshing locked dependencies: $project"
            dotnet restore $project --force-evaluate -p:RestoreLockedMode=false --verbosity minimal
            if ($LASTEXITCODE -ne 0) { throw "Restore failed: $project" }
          }
      - name: Commit and push migrated test source and refreshed NuGet locks
        shell: pwsh
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -u
          git diff --cached --stat
          git diff --cached --quiet
          if ($LASTEXITCODE -eq 0) {
            Write-Host 'No source or lock file changes to commit'
            exit 0
          }
          git commit -m "VPS-01: migrate test fixture APIs and regenerate NuGet package locks"
          if ($LASTEXITCODE -ne 0) { throw 'Failed to commit lock files' }
          git push origin "HEAD:refs/heads/codex/vps-01-test-contract-foundation"
          if ($LASTEXITCODE -ne 0) { throw 'Failed to push updated lock files' }
