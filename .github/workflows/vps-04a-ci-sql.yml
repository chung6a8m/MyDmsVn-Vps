name: VPS-04A — Self-contained Linux HTTPS to SQL13 CI

on:
  pull_request:
    types: [opened, reopened, synchronize]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vps04a-ci-sql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  isolated-sql13:
    name: Ubuntu .NET 10 + private SQL2022 Docker + HTTPS + 4/4 SQL oracles
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    env:
      MYDMSVN_WEB_ORIGIN: https://localhost:50443
      MYDMSVN_WEB_JWT_ISSUER: https://localhost:50443
      MYDMSVN_WEB_JWT_AUDIENCE: vps04a-ci
      MYDMSVN_WEB_JWT_ACTIVE_KID: ci-key
      MYDMSVN_WEB_OPERATION_MODE: web5
      MYDMSVN_WEB_DESKTOP_API: enabled
      MYDMSVN_WEB_SUPERUSER_USERNAME: vps04a_ci_writer
      VPS04A_LIVE_USERNAME: vps04a_ci_writer
      VPS04A_LIVE_DENIED_USERNAME: vps04a_ci_denied
      VPS04A_LIVE_ALLOW_MUTATION: approved-nonproduction-only
      VPS04A_CI_EPHEMERAL_SQL: approved-container-only
      DOTNET_NOLOGO: "1"

    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.404"
      - name: Require exact pinned SDK and GitHub hosted Linux runner
        shell: bash
        run: |
          set -euo pipefail
          test "$(cd src/MyDmsVn.Server.AspNetCoreHost && dotnet --version)" = "10.0.404"
          test "${RUNNER_OS}" = "Linux"
          test "${GITHUB_ACTIONS}" = "true"

      - name: Generate job-scoped credentials and two localhost TLS certificates
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          work="$(mktemp -d)"
          # Strong, independent per-job credentials, never GitHub Environment secrets.
          sa="CiA@9$(openssl rand -hex 24)"
          runtime="CiR@9$(openssl rand -hex 24)"
          oracle="CiO@9$(openssl rand -hex 24)"
          writer="CiW@9$(openssl rand -hex 24)"
          denied="CiD@9$(openssl rand -hex 24)"
          jwt="$(openssl rand -base64 32 | tr -d '\n')"
          for secret in "$sa" "$runtime" "$oracle" "$writer" "$denied" "$jwt"; do
            echo "::add-mask::$secret"
          done

          # The server certificate is verified by the Linux runner; no -k, no
          # TrustServerCertificate and no external SQL address can be admitted.
          openssl req -x509 -newkey rsa:3072 -nodes -keyout "$work/sql.key" -out "$work/sql.crt" \
            -days 1 -subj "/CN=localhost" -addext "subjectAltName=DNS:localhost,IP:127.0.0.1" >/dev/null 2>&1
          openssl req -x509 -newkey rsa:3072 -nodes -keyout "$work/https.key" -out "$work/https.crt" \
            -days 1 -subj "/CN=localhost" -addext "subjectAltName=DNS:localhost,IP:127.0.0.1" >/dev/null 2>&1
          sudo cp "$work/sql.crt" /usr/local/share/ca-certificates/vps04a-sql.crt
          sudo cp "$work/https.crt" /usr/local/share/ca-certificates/vps04a-https.crt
          sudo update-ca-certificates >/dev/null 2>&1

          cat > "$work/mssql.conf" <<'CONF'
          [network]
          tlscert = /etc/ssl/certs/vps04a-sql.pem
          tlskey = /etc/ssl/private/vps04a-sql.key
          tlsprotocols = 1.2
          forceencryption = 1
          CONF
          # SQL Server container runs as uid 10001; TLS private key must not be world-readable.
          sudo chown 10001:0 "$work/sql.key"
          sudo chmod 0400 "$work/sql.key"
          chmod 0444 "$work/sql.crt" "$work/mssql.conf"
          {
            echo "VPS04A_CI_TLS_DIR=$work"
            echo "MSSQL_SA_PASSWORD=$sa"
            echo "VPS04A_CI_SQL_ADMIN_CONNECTION_STRING=Server=localhost,1433;Initial Catalog=master;User ID=sa;Password=$sa;Encrypt=True;TrustServerCertificate=False;Connection Timeout=5;Pooling=False"
            echo "VPS04A_CI_SQL_RUNTIME_PASSWORD=$runtime"
            echo "VPS04A_CI_SQL_ORACLE_PASSWORD=$oracle"
            echo "VPS04A_LIVE_PASSWORD=$writer"
            echo "VPS04A_LIVE_DENIED_PASSWORD=$denied"
            echo "MYDMSVN_WEB_JWT_KEYS=ci-key:$jwt"
          } >> "$GITHUB_ENV"

      - name: Launch private disposable Microsoft SQL Server 2022
        shell: bash
        run: |
          set -euo pipefail
          # No volume for database files. Port bound to runner loopback ONLY.
          docker run -d --name vps04a-ci-sql --hostname vps04a-ci-sql \
            --pull=always -e ACCEPT_EULA=Y -e MSSQL_PID=Developer -e MSSQL_SA_PASSWORD \
            -p 127.0.0.1:1433:1433 \
            -v "$VPS04A_CI_TLS_DIR/mssql.conf:/var/opt/mssql/mssql.conf:ro" \
            -v "$VPS04A_CI_TLS_DIR/sql.crt:/etc/ssl/certs/vps04a-sql.pem:ro" \
            -v "$VPS04A_CI_TLS_DIR/sql.key:/etc/ssl/private/vps04a-sql.key:ro" \
            mcr.microsoft.com/mssql/server:2022-latest >/dev/null
          test "$(docker inspect -f '{{.State.Running}}' vps04a-ci-sql)" = "true"

      - name: Restore and compile original DbUp13 migrator under CI-only net10 bootstrap
        working-directory: src/MyDmsVn.Server.AspNetCoreHost
        shell: bash
        run: |
          set -euo pipefail
          dotnet restore ../../tests/MyDmsVn.Vps04a.SqlBootstrap/MyDmsVn.Vps04a.SqlBootstrap.csproj \
            -p:Vps04Server=true --force-evaluate -v minimal
          dotnet build ../../tests/MyDmsVn.Vps04a.SqlBootstrap/MyDmsVn.Vps04a.SqlBootstrap.csproj \
            -p:Vps04Server=true -c Release -f net10.0 --no-restore -warnaserror -v minimal

      - name: Apply original 001-013 migrations, principal allowlists and disposable seeds
        working-directory: src/MyDmsVn.Server.AspNetCoreHost
        shell: bash
        run: |
          set -euo pipefail
          # The bootstrap is fail-closed to GITHUB_ACTIONS=true, exact localhost:1433,
          # fresh fixed-name database, encrypted verified SQL and explicit CI scope.
          dotnet run --project ../../tests/MyDmsVn.Vps04a.SqlBootstrap/MyDmsVn.Vps04a.SqlBootstrap.csproj \
            -p:Vps04Server=true -c Release -f net10.0 --no-build --no-restore -- provision-isolated-ci

      - name: Restore and compile locked .NET10 production host and opt-in acceptance tests
        working-directory: src/MyDmsVn.Server.AspNetCoreHost
        shell: bash
        run: |
          set -euo pipefail
          dotnet restore MyDmsVn.Server.AspNetCoreHost.csproj -p:Vps04Server=true --locked-mode
          dotnet build MyDmsVn.Server.AspNetCoreHost.csproj -p:Vps04Server=true -c Release -f net10.0 --no-restore -warnaserror
          dotnet restore ../../tests/MyDmsVn.Server.AspNetCoreHost.Tests/MyDmsVn.Server.AspNetCoreHost.Tests.csproj \
            -p:Vps04Server=true -p:Vps04ALive=true --locked-mode
          dotnet build ../../tests/MyDmsVn.Server.AspNetCoreHost.Tests/MyDmsVn.Server.AspNetCoreHost.Tests.csproj \
            -p:Vps04Server=true -p:Vps04ALive=true -c Release -f net10.0 --no-restore -warnaserror

      - name: Run actual Kestrel HTTPS against private SQL; independently reconcile SQL journal
        shell: bash
        run: |
          set -euo pipefail
          work="$VPS04A_CI_TLS_DIR"
          server_pid=""
          cleanup() {
            if [ -n "$server_pid" ]; then
              kill "$server_pid" 2>/dev/null || true
              wait "$server_pid" 2>/dev/null || true
            fi
          }
          trap cleanup EXIT
          https_password="CiTls@9$(openssl rand -hex 16)"
          echo "::add-mask::$https_password"
          openssl pkcs12 -export -out "$work/https.pfx" -inkey "$work/https.key" \
            -in "$work/https.crt" -passout "pass:$https_password" >/dev/null 2>&1
          export ASPNETCORE_URLS=https://localhost:50443
          export ASPNETCORE_Kestrel__Certificates__Default__Path="$work/https.pfx"
          export ASPNETCORE_Kestrel__Certificates__Default__Password="$https_password"
          dotnet src/MyDmsVn.Server.AspNetCoreHost/bin/Release/net10.0/MyDmsVn.Server.AspNetCoreHost.dll \
            >"$work/host.log" 2>&1 &
          server_pid="$!"
          ready=0
          for attempt in $(seq 1 60); do
            if ! kill -0 "$server_pid" 2>/dev/null; then
              echo "::error::Actual NET10 host refused SQL/TLS/security admission; no live PASS."
              exit 1
            fi
            if curl --silent --fail --max-time 3 https://localhost:50443/api/v1/health >/dev/null; then
              ready=1
              break
            fi
            sleep 2
          done
          test "$ready" = 1 || { echo "::error::HTTPS Kestrel health failed without TLS bypass."; exit 1; }

          mkdir -p vps04a-ci-trx
          (cd src/MyDmsVn.Server.AspNetCoreHost && \
            dotnet test ../../tests/MyDmsVn.Server.AspNetCoreHost.Tests/MyDmsVn.Server.AspNetCoreHost.Tests.csproj \
            -p:Vps04Server=true -p:Vps04ALive=true -c Release -f net10.0 --no-build --no-restore \
            --filter 'FullyQualifiedName~Vps04aLiveSqlAcceptanceTests' \
            --logger 'trx;LogFileName=vps04a-ci-https-sql.trx' --results-directory "$GITHUB_WORKSPACE/vps04a-ci-trx")
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          paths=list(Path('vps04a-ci-trx').glob('*.trx'))
          assert len(paths)==1, f'Expected one live TRX, got {len(paths)}'
          ns={'t':'http://microsoft.com/schemas/VisualStudio/TeamTest/2010'}
          counts=ET.parse(paths[0]).getroot().find('./t:ResultSummary/t:Counters',ns)
          assert counts is not None
          got={name:int(counts.attrib[name]) for name in ('total','executed','passed','failed','notExecuted')}
          assert got == {'total':4,'executed':4,'passed':4,'failed':0,'notExecuted':0},got
          print('PASS: 4/4 isolated Linux Kestrel HTTPS -> real SQL Server tests; zero failed/skipped')
          PY

      - name: Upload only safe TRX (no passwords, no TLS private keys, no host logs)
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: vps04a-selfcontained-https-sql-trx
          path: vps04a-ci-trx/*.trx
          if-no-files-found: warn
      - name: Always destroy test SQL container, TLS files and generated credentials
        if: always()
        shell: bash
        run: |
          docker rm -f -v vps04a-ci-sql >/dev/null 2>&1 || true
          if [ -n "${VPS04A_CI_TLS_DIR:-}" ] && [ -d "$VPS04A_CI_TLS_DIR" ]; then
            sudo rm -rf -- "$VPS04A_CI_TLS_DIR"
          fi
          sudo rm -f /usr/local/share/ca-certificates/vps04a-sql.crt \
                     /usr/local/share/ca-certificates/vps04a-https.crt
