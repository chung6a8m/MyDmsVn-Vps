name: VPS-04A — approved Linux HTTPS to isolated SQL acceptance

on:
  workflow_dispatch:
    inputs:
      nonproduction_ack:
        description: "Type approved-isolated-sql13 to authorize destructive, isolated SQL acceptance"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: vps04a-live-${{ github.ref }}
  cancel-in-progress: false

jobs:
  live-linux-https-sql:
    if: github.event.inputs.nonproduction_ack == 'approved-isolated-sql13'
    name: Linux Kestrel TLS + exact13 SQL + JWT + journal + concurrency
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    # Owner must configure environment protection and every secret before dispatch.
    environment: vps04a-sql-nonproduction
    env:
      MYDMSVN_WEB_ORIGIN: https://localhost:50443
      MYDMSVN_WEB_JWT_ISSUER: https://localhost:50443
      MYDMSVN_WEB_JWT_AUDIENCE: ${{ secrets.VPS04A_JWT_AUDIENCE }}
      MYDMSVN_WEB_JWT_ACTIVE_KID: ${{ secrets.VPS04A_JWT_KID }}
      MYDMSVN_WEB_JWT_KEYS: ${{ secrets.VPS04A_JWT_KEYS }}
      MYDMSVN_WEB_OPERATION_MODE: web5
      MYDMSVN_WEB_DESKTOP_API: enabled
      MYDMSVN_WEB_SQL_CONNECTION_STRING: ${{ secrets.VPS04A_RUNTIME_SQL }}
      MYDMSVN_WEB_SUPERUSER_USERNAME: ${{ secrets.VPS04A_SUPERUSER_USERNAME }}
      VPS04A_SQL_ORACLE_CONNECTION_STRING: ${{ secrets.VPS04A_ORACLE_SQL }}
      VPS04A_LIVE_USERNAME: ${{ secrets.VPS04A_WRITER_USERNAME }}
      VPS04A_LIVE_PASSWORD: ${{ secrets.VPS04A_WRITER_PASSWORD }}
      VPS04A_LIVE_DENIED_USERNAME: ${{ secrets.VPS04A_DENIED_USERNAME }}
      VPS04A_LIVE_DENIED_PASSWORD: ${{ secrets.VPS04A_DENIED_PASSWORD }}
      VPS04A_LIVE_CUSTOMER_ID: ${{ vars.VPS04A_CUSTOMER_ID }}
      VPS04A_LIVE_WAREHOUSE_ID: ${{ vars.VPS04A_WAREHOUSE_ID }}
      VPS04A_LIVE_EMPLOYEE_ID: ${{ vars.VPS04A_EMPLOYEE_ID }}
      VPS04A_LIVE_PRODUCT_ID: ${{ vars.VPS04A_PRODUCT_ID }}
      VPS04A_LIVE_ALLOW_MUTATION: approved-nonproduction-only

    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.404"
      - name: Reject missing protected SQL, app credentials and reference seeds
        shell: bash
        run: |
          set -euo pipefail
          for key in MYDMSVN_WEB_JWT_AUDIENCE MYDMSVN_WEB_JWT_ACTIVE_KID MYDMSVN_WEB_JWT_KEYS \
                     MYDMSVN_WEB_SQL_CONNECTION_STRING MYDMSVN_WEB_SUPERUSER_USERNAME \
                     VPS04A_SQL_ORACLE_CONNECTION_STRING VPS04A_LIVE_USERNAME VPS04A_LIVE_PASSWORD \
                     VPS04A_LIVE_DENIED_USERNAME VPS04A_LIVE_DENIED_PASSWORD \
                     VPS04A_LIVE_CUSTOMER_ID VPS04A_LIVE_WAREHOUSE_ID VPS04A_LIVE_EMPLOYEE_ID VPS04A_LIVE_PRODUCT_ID; do
            if [ -z "${!key:-}" ]; then echo "::error::Protected acceptance setting missing: $key"; exit 1; fi
          done
          test "$(cd src/MyDmsVn.Server.AspNetCoreHost && dotnet --version)" = "10.0.404"
      - name: Locked restore and warning-free Linux host build
        working-directory: src/MyDmsVn.Server.AspNetCoreHost
        run: |
          dotnet restore MyDmsVn.Server.AspNetCoreHost.csproj -p:Vps04Server=true --locked-mode
          dotnet build MyDmsVn.Server.AspNetCoreHost.csproj -p:Vps04Server=true -c Release -f net10.0 --no-restore -warnaserror
      - name: Locked restore and compile explicitly admitted live tests
        working-directory: src/MyDmsVn.Server.AspNetCoreHost
        run: |
          dotnet restore ../../tests/MyDmsVn.Server.AspNetCoreHost.Tests/MyDmsVn.Server.AspNetCoreHost.Tests.csproj -p:Vps04Server=true -p:Vps04ALive=true --locked-mode
          dotnet build ../../tests/MyDmsVn.Server.AspNetCoreHost.Tests/MyDmsVn.Server.AspNetCoreHost.Tests.csproj -p:Vps04Server=true -p:Vps04ALive=true -c Release -f net10.0 --no-restore -warnaserror
      - name: Start actual HTTPS Kestrel and execute SQL-backed acceptance
        shell: bash
        run: |
          set -euo pipefail
          work="$(mktemp -d)"
          host_pid=""
          cleanup() {
            if [ -n "$host_pid" ]; then kill "$host_pid" 2>/dev/null || true; wait "$host_pid" 2>/dev/null || true; fi
            rm -rf -- "$work"
          }
          trap cleanup EXIT
          # This trust root exists only inside the ephemeral GitHub runner.
          openssl req -x509 -newkey rsa:3072 -nodes -keyout "$work/key.pem" -out "$work/cert.pem" \
            -days 1 -subj '/CN=localhost' -addext 'subjectAltName=DNS:localhost' >/dev/null 2>&1
          password="$(openssl rand -hex 24)"
          openssl pkcs12 -export -out "$work/cert.pfx" -inkey "$work/key.pem" -in "$work/cert.pem" \
            -passout "pass:$password" >/dev/null 2>&1
          sudo cp "$work/cert.pem" /usr/local/share/ca-certificates/vps04a-local.crt
          sudo update-ca-certificates >/dev/null 2>&1
          export ASPNETCORE_URLS=https://localhost:50443
          export ASPNETCORE_Kestrel__Certificates__Default__Path="$work/cert.pfx"
          export ASPNETCORE_Kestrel__Certificates__Default__Password="$password"
          dotnet src/MyDmsVn.Server.AspNetCoreHost/bin/Release/net10.0/MyDmsVn.Server.AspNetCoreHost.dll \
            >"$work/host.log" 2>&1 &
          host_pid="$!"
          ready=0
          for attempt in $(seq 1 45); do
            if ! kill -0 "$host_pid" 2>/dev/null; then
              echo "::error::Linux Kestrel startup refused; verify exact13 schema and restricted principals."
              exit 1
            fi
            if curl --silent --fail --max-time 2 https://localhost:50443/api/v1/health >/dev/null; then ready=1; break; fi
            sleep 1
          done
          test "$ready" = 1 || { echo "::error::Verified HTTPS health never became ready."; exit 1; }
          mkdir -p vps04a-live-trx
          dotnet test tests/MyDmsVn.Server.AspNetCoreHost.Tests/MyDmsVn.Server.AspNetCoreHost.Tests.csproj \
            -p:Vps04Server=true -p:Vps04ALive=true -c Release -f net10.0 --no-build --no-restore \
            --filter 'FullyQualifiedName~Vps04aLiveSqlAcceptanceTests' \
            --logger 'trx;LogFileName=vps04a-live-https-sql.trx' --results-directory "$GITHUB_WORKSPACE/vps04a-live-trx"
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          files=list(Path('vps04a-live-trx').glob('*.trx'))
          assert len(files)==1, f'Expected one final live TRX, got {len(files)}'
          ns={'t':'http://microsoft.com/schemas/VisualStudio/TeamTest/2010'}
          counts=ET.parse(files[0]).getroot().find('./t:ResultSummary/t:Counters',ns)
          assert counts is not None
          actual={name:int(counts.attrib[name]) for name in ('total','passed','failed','notExecuted')}
          assert actual == {'total':4,'passed':4,'failed':0,'notExecuted':0},actual
          print('PASS: 4/4 real Linux HTTPS-to-SQL tests, zero failed/skipped')
          PY
      - name: Keep exact-SHA live test TRX, never secrets or server logs
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: vps04a-live-https-sql-trx
          path: vps04a-live-trx/*.trx
          if-no-files-found: warn
