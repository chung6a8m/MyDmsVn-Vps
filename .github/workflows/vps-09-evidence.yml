name: VPS-09 — signed evidence and protected integrated acceptance

on:
  pull_request:
    types: [opened, reopened, synchronize]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      reviewed_sha:
        description: 'Exact reviewed main SHA (40 lowercase hex)'
        required: false
        type: string
      approved_scope:
        description: 'reviewed-isolated-fullstack-only enables protected nonproduction jobs'
        required: false
        type: string

permissions:
  contents: read

env:
  VPS09_SOURCE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

concurrency:
  group: vps09-${{ github.ref }}
  cancel-in-progress: false

jobs:
  source-evidence-policy:
    name: Source inventory and 33 synthetic signed-evidence tests (NOT live acceptance)
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.VPS09_SOURCE_SHA }}
          persist-credentials: false
      - name: Refuse synthetic pull merge ref
        shell: bash
        run: test "$(git rev-parse HEAD)" = "$VPS09_SOURCE_SHA"
      - name: Enforce 57-route inventory, 293 frozen variants and gate registry
        run: python3 scripts/vps09_verify.py inventory
      - name: Execute synthetic signed-packet admission/refusal tests
        run: python3 -m unittest discover -s scripts/tests -p 'test_vps09_verify.py' -v

  windows-source-policy:
    name: Windows PowerShell syntax and fail-closed admission (NO SQL or GUI)
    runs-on: windows-2022
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.VPS09_SOURCE_SHA }}
          persist-credentials: false
      - name: Reject synthetic ref and malformed Windows operator runner
        shell: pwsh
        run: |
          if ((git rev-parse HEAD).Trim() -cne "$env:VPS09_SOURCE_SHA") { throw 'VPS09.SourceShaMismatch' }
          $tokens = $null
          $parseErrors = $null
          $script = (Resolve-Path scripts/Invoke-Vps09WindowsAcceptance.ps1).Path
          $null = [System.Management.Automation.Language.Parser]::ParseFile($script, [ref]$tokens, [ref]$parseErrors)
          if ($parseErrors.Count -ne 0) { throw "VPS09.WindowsScriptParser: $($parseErrors[0].Message)" }
      - name: Explicitly unapproved execution must refuse before networking/SQL
        shell: pwsh
        run: |
          $env:VPS09_ISOLATED_SQL_ADMISSION = ''
          try {
            ./scripts/Invoke-Vps09WindowsAcceptance.ps1 -ReviewedSha ('a' * 40) -Origin 'https://staging.invalid' -EvidenceDirectory "$env:RUNNER_TEMP/vps09-negative"
            throw 'VPS09.MissingAdmissionAccepted'
          }
          catch {
            if ($_.Exception.Message -notmatch 'VPS09.IsolatedSqlApprovalMissing') { throw }
          }
          Write-Host 'VPS09_WINDOWS_SOURCE_REFUSAL_PASS: syntax and missing approval'

  windows-live-bounded:
    name: Protected Windows x86 publish and remote HTTPS to SQL tests (NOT GUI closeout)
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/main' &&
      inputs.approved_scope == 'reviewed-isolated-fullstack-only' &&
      inputs.reviewed_sha == github.sha
    needs: [source-evidence-policy, windows-source-policy]
    runs-on: [self-hosted, windows, vps09-attended]
    environment: vps09-fullstack-nonproduction
    timeout-minutes: 60
    env:
      VPS09_ISOLATED_SQL_ADMISSION: ${{ secrets.VPS09_ISOLATED_SQL_ADMISSION }}
      MYDMSVN_WEB_ORIGIN: ${{ vars.VPS09_PUBLIC_ORIGIN }}
      MYDMSVN_WEB_JWT_ISSUER: ${{ vars.VPS09_PUBLIC_ORIGIN }}
      MYDMSVN_WEB_JWT_AUDIENCE: ${{ secrets.VPS09_JWT_AUDIENCE }}
      MYDMSVN_WEB_OPERATION_MODE: web5
      VPS04A_LIVE_ALLOW_MUTATION: approved-nonproduction-only
      VPS04A_SQL_ORACLE_CONNECTION_STRING: ${{ secrets.VPS09_READONLY_SQL_ORACLE }}
      VPS04A_LIVE_USERNAME: ${{ secrets.VPS09_WRITER_USERNAME }}
      VPS04A_LIVE_PASSWORD: ${{ secrets.VPS09_WRITER_PASSWORD }}
      VPS04A_LIVE_DENIED_USERNAME: ${{ secrets.VPS09_DENIED_USERNAME }}
      VPS04A_LIVE_DENIED_PASSWORD: ${{ secrets.VPS09_DENIED_PASSWORD }}
      VPS04A_LIVE_CUSTOMER_ID: ${{ vars.VPS09_CUSTOMER_ID }}
      VPS04A_LIVE_WAREHOUSE_ID: ${{ vars.VPS09_WAREHOUSE_ID }}
      VPS04A_LIVE_EMPLOYEE_ID: ${{ vars.VPS09_EMPLOYEE_ID }}
      VPS04A_LIVE_PRODUCT_ID: ${{ vars.VPS09_PRODUCT_ID }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: |
            8.0.400
            10.0.404
      - name: Require exact reviewed main HEAD
        shell: pwsh
        run: |
          if ((git rev-parse HEAD).Trim() -cne '${{ github.sha }}') {
            throw 'VPS09.NotReviewedMainHead'
          }
      - name: Execute bounded real remote HTTPS and SQL checks; no GUI claim
        shell: pwsh
        run: |
          ./scripts/Invoke-Vps09WindowsAcceptance.ps1 -ReviewedSha '${{ github.sha }}' -Origin "$env:MYDMSVN_WEB_ORIGIN" -EvidenceDirectory "$env:RUNNER_TEMP\vps09-acceptance"
      - name: Retain only sanitized bounded summary; raw TRX remains on runner
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: vps09-windows-bounded-${{ github.sha }}
          path: ${{ runner.temp }}/vps09-acceptance/vps09-windows-bounded-summary.json
          if-no-files-found: warn
          retention-days: 7

  independent-release-review:
    name: Verify signed fullstack receipt (structural only; no implicit release)
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/main' &&
      inputs.approved_scope == 'reviewed-isolated-fullstack-only' &&
      inputs.reviewed_sha == github.sha
    needs: [source-evidence-policy, windows-live-bounded]
    runs-on: [self-hosted, linux, vps09-reviewer]
    environment: vps09-release-review
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Refuse key mismatch, missing receipt and unreviewed SHA
        env:
          TRUSTED_PUBKEY_SHA256: ${{ vars.VPS09_OWNER_PUBKEY_SHA256 }}
          REVIEWED_BUNDLE_PATH: ${{ vars.VPS09_REVIEW_PACKET_PATH }}
          REVIEWED_PUBKEY_PATH: ${{ vars.VPS09_OWNER_PUBKEY_PATH }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$RUNNER_OS" = Linux
          [[ "$TRUSTED_PUBKEY_SHA256" =~ ^[a-f0-9]{64}$ ]]
          test -n "$REVIEWED_BUNDLE_PATH" && test -n "$REVIEWED_PUBKEY_PATH"
          python3 scripts/vps09_verify.py verify \
            --bundle "$REVIEWED_BUNDLE_PATH" \
            --expected-sha "$GITHUB_SHA" \
            --trusted-key "$REVIEWED_PUBKEY_PATH" \
            --trusted-key-sha256 "$TRUSTED_PUBKEY_SHA256"
          echo "VPS09_RECEIPT_STRUCTURAL_ONLY: independent reviewer must audit physical evidence."
