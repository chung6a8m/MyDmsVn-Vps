name: VPS-01 — xUnit v3 discovery and contract guard

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vps-01-test-contract-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  topology:
    name: xUnit v3 executable topology and route inventory (static only)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - name: Verify test project topology and local contracts
        run: python3 scripts/verify-vps-01.py

  windows-test-discovery:
    name: Windows xUnit v3 compile/discovery — ${{ matrix.id }}
    runs-on: windows-2022
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: desktop
            minimum_tests: 813
            project: tests/MyDmsVn.Desktop.Tests/MyDmsVn.Desktop.Tests.csproj
          - id: desktop-ui
            minimum_tests: 382
            project: tests/MyDmsVn.Desktop.Ui.Tests/MyDmsVn.Desktop.Ui.Tests.csproj
          - id: sql-catalog
            minimum_tests: 17
            project: tests/MyDmsVn.Server.Infrastructure.Catalog.Tests/MyDmsVn.Server.Infrastructure.Catalog.Tests.csproj
          - id: sql-foundation
            minimum_tests: 66
            project: tests/MyDmsVn.Server.Infrastructure.Foundation.Tests/MyDmsVn.Server.Infrastructure.Foundation.Tests.csproj
          - id: sql-harness
            minimum_tests: 59
            project: tests/MyDmsVn.Server.Infrastructure.IntegrationTests/MyDmsVn.Server.Infrastructure.IntegrationTests.csproj
          - id: sql-inventory
            minimum_tests: 127
            project: tests/MyDmsVn.Server.Infrastructure.Inventory.Tests/MyDmsVn.Server.Infrastructure.Inventory.Tests.csproj
          - id: sql-migrations
            minimum_tests: 107
            project: tests/MyDmsVn.Server.Infrastructure.Migrations.Tests/MyDmsVn.Server.Infrastructure.Migrations.Tests.csproj
          - id: sql-security
            minimum_tests: 1684
            project: tests/MyDmsVn.Server.Infrastructure.Security.Tests/MyDmsVn.Server.Infrastructure.Security.Tests.csproj
          - id: vps03-acceptance
            minimum_tests: 38
            project: tests/MyDmsVn.Vps03.Acceptance.Tests/MyDmsVn.Vps03.Acceptance.Tests.csproj
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '8.0.400'
      - name: Locked restore and Release compile
        shell: pwsh
        env:
          PROJECT: ${{ matrix.project }}
        run: |
          dotnet restore $env:PROJECT --locked-mode -v minimal
          if ($LASTEXITCODE -ne 0) { throw "Locked restore failed: $env:PROJECT" }
          dotnet build $env:PROJECT --no-restore -c Release -f net48 -v minimal
          if ($LASTEXITCODE -ne 0) { throw "Build failed: $env:PROJECT" }
      - name: Verify nonempty VSTest discovery; do not claim SQL, GUI or VPS-03 acceptance
        shell: pwsh
        env:
          PROJECT: ${{ matrix.project }}
          MINIMUM_TESTS: ${{ matrix.minimum_tests }}
        run: |
          $output = @(dotnet test $env:PROJECT -c Release -f net48 --no-build --no-restore --list-tests -v normal 2>&1)
          $output | ForEach-Object { Write-Host $_ }
          if ($LASTEXITCODE -ne 0) { throw "Discovery failed: $env:PROJECT" }
          if (@($output | Where-Object { "$_" -match 'The following Tests are available:' }).Count -lt 1) {
            throw "VSTest listed no test cases: $env:PROJECT"
          }
          if (($output -join "`n") -match 'No test is available|No tests found') {
            throw "Empty VSTest discovery: $env:PROJECT"
          }
          # Indented fully-qualified test cases, excluding [xUnit.net] diagnostics.
          $cases = @($output | Where-Object { "$_" -match '^\s{4,}MyDmsVn\.' })
          if ($cases.Count -lt [int]$env:MINIMUM_TESTS) {
            throw "Discovered $($cases.Count) tests, below VPS-01 floor $env:MINIMUM_TESTS for $env:PROJECT"
          }
          Write-Host "Discovered test cases=$($cases.Count); minimum=$env:MINIMUM_TESTS (NOT an SQL/GUI execution PASS)"
      - name: Execute VPS-10.3 Desktop numeric and date input regression
        if: matrix.id == 'desktop'
        shell: pwsh
        env:
          PROJECT: ${{ matrix.project }}
        run: |
          $results = Join-Path $env:RUNNER_TEMP 'vps10-desktop-culture'
          $filters = @{
            'numeric' = 'FullyQualifiedName~ReceiptNumericInputTests'
            'date' = 'FullyQualifiedName~DesktopDateInputIntegrationTests|FullyQualifiedName~DateInputCorrection_Goods_required_date_step_waits_for_admitted_save|FullyQualifiedName~Goods_required_date_native_characters_keep_model_until_enter|FullyQualifiedName~Required_date_keeps_raw_edit_through_state_and_blocks_save_post_and_back_until_valid|FullyQualifiedName~Required_date_error_clears_after_native_enter_then_successful_save|FullyQualifiedName~Goods_authoritative_date_change_cancels_old_pending_candidate'
          }
          foreach ($group in @('numeric', 'date')) {
            dotnet test $env:PROJECT -c Release -f net48 --no-build --no-restore `
              --filter $filters[$group] `
              --logger "trx;LogFileName=vps10-$group.trx" --results-directory $results -v minimal
            if ($LASTEXITCODE -ne 0) { throw "VPS-10.3 $group regression failed" }
            [xml]$trx = Get-Content -LiteralPath (Join-Path $results "vps10-$group.trx") -Raw
            $counts = $trx.TestRun.ResultSummary.Counters
            if ([int]$counts.total -le 0 -or [int]$counts.executed -ne [int]$counts.total -or
                [int]$counts.passed -ne [int]$counts.total -or [int]$counts.failed -ne 0 -or
                [int]$counts.notExecuted -ne 0) {
              throw "VPS-10.3 $group regression failed or not executed: $($counts.OuterXml)"
            }
            Write-Host "VPS-10.3 $group tests executed=$($counts.executed), passed=$($counts.passed); not attended physical GUI acceptance"
          }
      - name: Preserve VPS-10.3 Desktop culture TRX
        if: always() && matrix.id == 'desktop'
        uses: actions/upload-artifact@v6
        with:
          name: vps10-desktop-culture
          path: ${{ runner.temp }}/vps10-desktop-culture/*.trx
          if-no-files-found: warn
      - name: Execute SQL-free VPS-05C net48 permission-import JSON oracle
        if: matrix.id == 'sql-security'
        shell: pwsh
        env:
          PROJECT: ${{ matrix.project }}
        run: |
          $results = Join-Path $env:RUNNER_TEMP 'vps05c-net48-json-oracle'
          dotnet test $env:PROJECT -c Release -f net48 --no-build --no-restore `
            --filter FullyQualifiedName~Vps05cPermissionImportJsonParityTests `
            --logger "trx;LogFileName=vps05c-net48-json-oracle.trx" --results-directory $results -v minimal
          if ($LASTEXITCODE -ne 0) { throw "VPS-05C net48 JSON oracle failed" }
          [xml]$trx = Get-Content -LiteralPath (Join-Path $results 'vps05c-net48-json-oracle.trx') -Raw
          $counters = $trx.TestRun.ResultSummary.Counters
          if ([int]$counters.total -ne 1 -or [int]$counters.passed -ne 1 -or
              [int]$counters.failed -ne 0 -or [int]$counters.notExecuted -ne 0) {
            throw "VPS-05C net48 JSON oracle count mismatch: $($counters.OuterXml)"
          }
